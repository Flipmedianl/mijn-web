name: Optimize 3D avatar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-avatar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install glTF Transform
        run: npm install --global @gltf-transform/cli

      - name: Create lightweight mobile avatar
        run: |
          gltf-transform optimize assets/avatar.glb assets/avatar-mobile.glb --compress draco --texture-compress webp --texture-size 1024
          ls -lh assets/avatar.glb assets/avatar-mobile.glb

      - name: Commit mobile avatar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatar-mobile.glb
          git diff --cached --quiet && exit 0
          git commit -m "Add lightweight mobile avatar"
          git push
