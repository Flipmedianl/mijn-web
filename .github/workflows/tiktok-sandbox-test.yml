name: TikTok Sandbox OAuth Test
on:
  push:
    branches: [main]
    paths: [.github/tiktok-live-test-trigger]
  workflow_dispatch:
    inputs:
      auth_code:
        description: "One-time TikTok authorization code (only when no reusable token secret exists)"
        required: false
        type: string
      post_mode:
        description: "auto tries Direct Post and falls back to an inbox draft"
        required: false
        default: auto
        type: choice
        options: [auto, direct, draft]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain TikTok access token
        id: token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE: ${{ inputs.auth_code }}
          TIKTOK_STORED_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$TIKTOK_STORED_ACCESS_TOKEN" ]; then
            TOKEN="$TIKTOK_STORED_ACCESS_TOKEN"
          elif [ -n "$TIKTOK_REFRESH_TOKEN" ]; then
            RESPONSE=$(curl --fail-with-body -sS -X POST "https://open.tiktokapis.com/v2/oauth/token/" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" --data-urlencode "grant_type=refresh_token" --data-urlencode "refresh_token=$TIKTOK_REFRESH_TOKEN")
            TOKEN=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["access_token"])' "$RESPONSE")
          elif [ -n "$TIKTOK_AUTH_CODE" ]; then
            RESPONSE=$(curl --fail-with-body -sS -X POST "https://open.tiktokapis.com/v2/oauth/token/" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" --data-urlencode "code=$TIKTOK_AUTH_CODE" --data-urlencode "grant_type=authorization_code" --data-urlencode "redirect_uri=https://flipmedianl.github.io/mijn-web/tiktok-callback.html")
            TOKEN=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["access_token"])' "$RESPONSE")
          else
            echo "No reusable TIKTOK_ACCESS_TOKEN/TIKTOK_REFRESH_TOKEN secret and no auth_code supplied." >&2; exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Test TikTok uploader
        run: python -m unittest tests/test_tiktok_upload.py
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build fresh FLIPMEDIA test video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build-flipmedia-short.py
      - name: Publish or upload FLIPMEDIA video to TikTok
        env:
          TIKTOK_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
          TIKTOK_VIDEO_FILE: content/short/flipmedia-short.mp4
          TIKTOK_POST_MODE: ${{ inputs.post_mode || 'auto' }}
        run: python scripts/tiktok-upload-video.py
