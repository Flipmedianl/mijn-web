name: TikTok Sandbox OAuth Test
on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "TikTok authorization code from callback URL"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build fresh FLIPMEDIA test video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build-flipmedia-short.py
      - name: Exchange code and upload private test video
        env:
          TIKTOK_AUTH_CODE: ${{ inputs.auth_code }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_VIDEO_FILE: content/short/flipmedia-short.mp4
        run: python scripts/tiktok-sandbox-test.py
