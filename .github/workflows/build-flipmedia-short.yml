name: Build FLIPMEDIA multi-clip Short\n# render trigger v4

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-flipmedia-short.py"
      - ".github/workflows/build-flipmedia-short.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build multi-clip Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build-flipmedia-short.py
      - name: Save used Pexels history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/used-pexels-ids.json
          git diff --cached --quiet || git commit -m "Remember Pexels clips used by FLIPMEDIA"
          git push
      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: flipmedia-multiclip-short
          path: |
            content/short/flipmedia-short.mp4
            content/short/manifest.json
          retention-days: 7
