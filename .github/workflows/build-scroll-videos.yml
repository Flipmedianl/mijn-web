name: Build fast scroll videos

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-scroll-videos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build videos
        shell: bash
        run: |
          mkdir -p assets/video
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -y -framerate 30 -start_number 1 -i frames/frame-%03d.webp -frames:v 61 -vf "scale=960:-2:force_original_aspect_ratio=decrease" -c:v libx264 -preset medium -crf 27 -g 1 -pix_fmt yuv420p -movflags +faststart assets/video/intro.mp4
          mkdir -p /tmp/scale
          n=1
          for i in $(seq 62 122); do
            cp "$(printf 'frames/frame-%03d.webp' "$i")" "$(printf '/tmp/scale/frame-%03d.webp' "$n")"
            n=$((n+1))
          done
          ffmpeg -y -framerate 30 -start_number 1 -i /tmp/scale/frame-%03d.webp -vf "scale=960:-2:force_original_aspect_ratio=decrease" -c:v libx264 -preset medium -crf 27 -g 1 -pix_fmt yuv420p -movflags +faststart assets/video/scale.mp4

      - name: Update page
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<canvas class="seq"></canvas>', '<video class="seq scroll-video" src="assets/video/intro.mp4?v=2" muted playsinline preload="auto"></video>', 1)
          s = s.replace('<canvas class="seq"></canvas>', '<video class="seq scroll-video" src="assets/video/scale.mp4?v=2" muted playsinline preload="metadata"></video>', 1)
          s = s.replace('.seq{position:absolute;inset:0;width:100%;height:100%}', '.seq{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}')
          start = s.index('<script>')
          end = s.index('</script>', start) + len('</script>')
          js = '''<script>
          const mobile=matchMedia('(max-width:800px)').matches;
          const scrubs=[...document.querySelectorAll('.scrub')].map(sec=>({sec,v:sec.querySelector('.scroll-video'),last:-1}));
          const avatar=document.querySelector('.avatar-sec'),model=document.querySelector('#model'),floaters=[...avatar.querySelectorAll('.float-card')];
          let ticking=false;
          function avatarUpdate(){const r=avatar.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const travel=Math.max(1,avatar.offsetHeight-innerHeight),p=Math.max(0,Math.min(1,-r.top/travel));if(model)model.cameraOrbit=`${-38+p*76}deg ${80-p*5}deg auto`;floaters.forEach((x,j)=>x.style.setProperty('--av',Math.max(0,Math.min(1,(p-(.1+j*.06))/.18))))}
          function update(){ticking=false;for(const s of scrubs){const r=s.sec.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const travel=Math.max(1,s.sec.offsetHeight-innerHeight),p=Math.max(0,Math.min(1,-r.top/travel));if(s.v.duration&&Number.isFinite(s.v.duration)){const t=p*Math.max(0,s.v.duration-.001);if(Math.abs(t-s.last)>.02){s.v.currentTime=t;s.last=t}}const hero=s.sec.querySelector('.hero');if(hero){const f=Math.min(1,p/.28);hero.style.opacity=1-f;hero.style.transform=mobile?`translateY(${-f*18}px)`:`translateY(calc(-50% - ${f*28}px))`}const ov=s.sec.querySelector('.overlay2');if(ov){const f=Math.max(0,Math.min(1,(p-.08)/.18));ov.style.opacity=f;ov.style.transform=mobile?`translateY(${(1-f)*24}px)`:`translateY(calc(-50% + ${(1-f)*30}px))`}}avatarUpdate()}
          function requestTick(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
          for(const s of scrubs){s.v.addEventListener('loadedmetadata',requestTick);s.v.addEventListener('canplay',requestTick)}
          addEventListener('scroll',requestTick,{passive:true});addEventListener('resize',requestTick,{passive:true});requestTick();
          const revealObserver=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');revealObserver.unobserve(e.target)}}),{rootMargin:'0px 0px -12% 0px',threshold:.08});document.querySelectorAll('.reveal').forEach(x=>revealObserver.observe(x));
          </script>'''
          p.write_text(s[:start] + js + s[end:])

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html assets/video/intro.mp4 assets/video/scale.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use lightweight scroll videos"
          git push
